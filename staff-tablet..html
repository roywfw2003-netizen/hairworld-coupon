<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair World 員工工作台</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:#FFF5E6;padding:20px;min-height:100vh}
.staff-container{max-width:1400px;margin:0 auto;background:#fff;border-radius:40px;box-shadow:0 10px 40px rgba(247,147,49,.2);padding:30px;border:1px solid #FFD8B2}
h1{color:#F25C0A;font-size:2rem;margin-bottom:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1 .ver{font-size:.8rem;color:#aaa;font-weight:400}
h3{color:#F25C0A;font-size:1.4rem;margin:15px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date-bar{display:flex;gap:15px;align-items:center;margin-bottom:25px;background:#FFF2E3;padding:15px 20px;border-radius:60px;border:1px solid #FFB985;flex-wrap:wrap}
.date-bar label{font-size:1.1rem;font-weight:600;color:#77450E}
.date-bar input[type=date]{flex:1;padding:12px 18px;border:2px solid #FFCDA5;border-radius:50px;font-size:1rem;background:#fff;min-width:150px}
.btn{border:none;padding:12px 20px;border-radius:50px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:.1s;min-width:100px}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn-success{background:#28a745;color:#fff;box-shadow:0 3px 0 #1e7e34}
.btn-warning{background:#ffc107;color:#333;box-shadow:0 3px 0 #d39e00}
.btn-secondary{background:#6c757d;color:#fff;box-shadow:0 3px 0 #545b62}
.btn-info{background:#17a2b8;color:#fff;box-shadow:0 3px 0 #117a8b}
.btn-small{background:#FFE1C7;color:#B04400;border:none;padding:8px 16px;font-size:.9rem;font-weight:600;border-radius:40px;cursor:pointer;box-shadow:0 2px 0 #FFB27F}
.pending-row{display:flex;gap:25px;margin-bottom:30px;flex-wrap:wrap}
.pending-col{flex:1;min-width:340px;background:#FFF9F2;border-radius:30px;padding:20px;border:2px solid #FFB985}
.record-list{max-height:460px;overflow-y:auto;border:1px solid #FFB985;border-radius:25px;background:#fff;padding:10px}
.record-item{background:#FFF9F2;border-radius:20px;padding:14px;margin-bottom:12px;border-left:6px solid #F25C0A;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.record-item.voucher{border-left-color:#28a745}
.record-info{flex:2;min-width:180px;font-size:1rem;line-height:1.55}
.record-info .time{color:#F25C0A;font-weight:700;font-size:1.1rem}
.record-info .sub{color:#B45A2A;font-size:.85rem}
.barber-selector{flex:1;min-width:170px;display:flex;flex-wrap:wrap;gap:6px;background:#FFE6D3;padding:10px;border-radius:40px}
.barber-selector label{display:flex;align-items:center;gap:4px;font-size:.85rem;background:#fff;padding:5px 10px;border-radius:40px;border:1px solid #FFB985;cursor:pointer}
.barber-selector input[type=radio]{width:16px;height:16px;accent-color:#F25C0A;margin:0}
.barber-chip{background:#fff;color:#B04400;border:1.5px solid #FFB985;border-radius:40px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;line-height:1.4;transition:all .15s;box-sizing:border-box}
.barber-chip.active{background:#F25C0A;color:#fff;border-color:#F25C0A}
.record-actions{display:flex;gap:8px;flex-wrap:wrap}
.total-badge{background:#F25C0A;color:#fff;padding:4px 12px;border-radius:40px;font-size:1rem;margin-left:8px}
.section-block{background:#FFF9F2;border-radius:30px;padding:20px;margin-bottom:30px;border:2px solid #FFB985}
.stats-container{margin-top:30px;padding:25px;background:#fff;border-radius:35px;border:3px solid #F25C0A}
.chart-container{height:320px;margin-bottom:25px}
.stats-summary{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.summary-card{background:#FFF2E3;padding:18px 28px;border-radius:30px;text-align:center;flex:1;min-width:130px}
.summary-card .number{font-size:2.4rem;font-weight:bold;color:#F25C0A}
.summary-card .label{font-size:1.1rem;color:#B04400}
select,input{font-size:1rem;padding:10px 15px;border-radius:40px;border:2px solid #FFB985;background:#fff;width:100%}
.form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.form-group label{display:flex!important;align-items:center;justify-content:space-between;gap:6px}
.form-group label.required .lab-text::after{content:" *";color:#dc3545;font-weight:700}
.req-toggle{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:500;color:#9a8f84;white-space:nowrap}
.req-toggle input{width:14px;height:14px;margin:0;accent-color:#F25C0A}
.req-toggle.on{color:#B04400;font-weight:700}
.req-toggle input:disabled{opacity:.35}
.admin-req-btn{padding:7px 12px;min-width:auto;font-size:.78rem;background:#6c757d;color:#fff;box-shadow:0 2px 0 #495057}
.admin-req-btn.on{background:#28a745;box-shadow:0 2px 0 #1e7e34}
.form-group{flex:1;min-width:130px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:#77450E;margin-bottom:4px}
.manual-buttons{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.btn-manual-student{background:#F25C0A;color:#fff;box-shadow:0 3px 0 #B04400}
.btn-manual-parent{background:#28a745;color:#fff;box-shadow:0 3px 0 #1e7e34}
.edit-section{background:#FFF2E3;border-radius:30px;padding:15px 20px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px}
.edit-mode-badge{background:#ffc107;color:#333;padding:4px 12px;border-radius:30px;font-size:.85rem;display:none;margin-left:8px}
.note{color:#B45A2A;font-size:.85rem;margin-top:10px;line-height:1.5}
.footer{margin-top:30px;text-align:center;color:#aaa;font-size:.85rem}
@media(max-width:820px){.pending-row{flex-direction:column}.staff-container{padding:15px}h1{font-size:1.5rem}.pending-col{min-width:100%}.date-bar{flex-direction:column;align-items:stretch}.date-bar .btn{width:100%}}

    .batch-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:10px 16px;background:#FFF3E8;border:2px solid #FFB985;border-radius:16px;font-size:15px;}
    .batch-bar .batch-count{color:#B45A2A;font-weight:700;}
    .batch-bar label{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;}
    .batch-chk{width:26px;height:26px;accent-color:#F25C0A;cursor:pointer;flex:none;margin-right:10px;}
    .batch-all{width:24px;height:24px;accent-color:#F25C0A;cursor:pointer;}
    .record-item.is-checked{background:#FFF3E8;}

/* ===== 夜間模式（只覆蓋配色，不改任何邏輯） ===== */
.theme-toggle{margin-left:auto;background:#fff;color:#B04400;border:1.5px solid #FFB985;border-radius:40px;padding:8px 16px;font-size:.9rem;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap}
body.dark{background:#0B0D10;color:#E8EAED}
body.dark .staff-container{background:#12151A;border-color:#2A2F36;box-shadow:0 10px 40px rgba(0,0,0,.6)}
body.dark .theme-toggle{background:#1A1F26;color:#E8EAED;border-color:#2F353D}
body.dark h1,body.dark h3{color:#FF7A2F}
body.dark .date-bar,body.dark .pending-col,body.dark .section-block,body.dark .edit-section{background:#171B21;border-color:#2F353D}
body.dark .date-bar label,body.dark .form-group label{color:#C3CAD2}
body.dark .note{color:#A8B1BB}
body.dark input,body.dark select{background:#1A1F26;border-color:#2F353D;color:#E8EAED}
body.dark .record-list{background:#151920;border-color:#2F353D}
body.dark .record-item{background:#171B21;border-left-color:#FF7A2F}
body.dark .record-item.voucher{border-left-color:#2FBF71}
body.dark .record-info .sub{color:#A8B1BB}
body.dark .barber-selector{background:#221A14}
body.dark .barber-chip{background:#1A1F26;border-color:#3A4048;color:#C3CAD2}
body.dark .barber-chip.active{background:#F25C0A;border-color:#F25C0A;color:#fff}
body.dark .btn-small{background:#2C2119;color:#FFB27F}
body.dark .batch-bar{background:#232A32;border-color:#2F353D;color:#C3CAD2}
body.dark .summary-card{background:#1F252C}
body.dark .stats-container{background:#171B21;border-color:#FF7A2F}
body.dark [style*="#e6f3ff"]{background:#121A20!important;border-color:#2A3F4A!important}
body.dark [style*="8FD3A2"]{border-color:#2A4A34!important}
body.dark .date-bar input[type=date]{background:#1A1F26;border-color:#2F353D;color:#E8EAED}
body.dark .barber-selector label{background:#1A1F26;border-color:#3A4048;color:#C3CAD2}
body.dark .record-item.is-checked{background:#232A32}

/* 夜間模式補充：深色文字在深底上的可讀性 */
body.dark h1 .ver{color:#8A949E}
body.dark .summary-card .label{color:#FFB27F}
body.dark .batch-bar .batch-count{color:#FFB27F}
body.dark .footer{color:#8A949E}
body.dark .record-info,body.dark .staff-container{color:#E8EAED}

/* ===== 頁面底色（店舖實景相片；一／二／沒有） ===== */
.bg-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:8px 12px;background:#FFF3E8;border:1px solid #FFB985;border-radius:14px;font-size:13px}
.bg-picker span{color:#B45A2A;font-weight:600}
.bg-choice{background:#fff;color:#B04400;border:1.5px solid #FFB985;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer}
.bg-choice.active{background:#F25C0A;color:#fff;border-color:#F25C0A}
body.dark .bg-picker{background:#171B21;border-color:#2F353D}
body.dark .bg-picker span{color:#FFB27F}
body.dark .bg-choice{background:#1A1F26;border-color:#3A4048;color:#C3CAD2}
body.dark .bg-choice.active{background:#F25C0A;border-color:#F25C0A;color:#fff}
body.dark .social-link{background:#3A4048!important;box-shadow:0 3px 10px rgba(0,0,0,.55)!important}

<body>
<div class="staff-container">
  <h1><i class="fa-solid fa-scissors"></i> Hair World 員工工作台 <span class="ver">iPad版 v11.2</span><span class="edit-mode-badge" id="editModeBadge">編輯模式已啟用</span><button type="button" id="themeToggle" class="theme-toggle">夜間模式</button></h1>

  <div class="edit-section">
    <div style="display:flex;align-items:center;gap:10px;">
      <i class="fa-solid fa-lock" style="color:#F25C0A;"></i>
      <span><strong>編輯模式</strong> — 啟用後可返回／刪除已完成及未到達記錄</span>
    </div>
    <button class="btn btn-info" id="unlockEditBtn" style="padding:10px 20px;min-width:auto;"><i class="fa-solid fa-key"></i> 解鎖編輯模式</button>
  </div>

  <div class="date-bar">
    <label for="staffDatePicker"><i class="fa-regular fa-calendar"></i> 日期：</label>
    <input type="date" id="staffDatePicker">
    <button class="btn btn-manual-student" id="staffRefreshBtn" style="box-shadow:0 3px 0 #B04400;"><i class="fa-solid fa-rotate-right"></i> 刷新</button>
  </div>


  <div class="pending-row">
    <div class="pending-col">
      <h3><i class="fa-solid fa-user" style="color:#F25C0A;"></i> 一般預約 待處理 <span class="total-badge" id="studentPendingCount">0</span></h3>
      <div class="batch-bar" id="studentPendingListBatchBar" style="display:none;"><label><input type="checkbox" class="batch-all" data-scope="studentPendingList"> 全選</label><span class="batch-count">已選 0 項</span><button class="btn btn-secondary batch-action" data-scope="studentPendingList" data-mode="revert" style="display:none;">批次返回</button><button class="btn btn-warning batch-action" data-scope="studentPendingList" data-mode="delete">批次刪除</button></div><div class="record-list" id="studentPendingList"></div>
    </div>
    <div class="pending-col" style="border-color:#8FD3A2;">
      <h3><i class="fa-solid fa-ticket" style="color:#28a745;"></i> 優惠券預約 待處理 <span class="total-badge" style="background:#28a745;" id="parentPendingCount">0</span></h3>
      <div class="batch-bar" id="parentPendingListBatchBar" style="display:none;"><label><input type="checkbox" class="batch-all" data-scope="parentPendingList"> 全選</label><span class="batch-count">已選 0 項</span><button class="btn btn-secondary batch-action" data-scope="parentPendingList" data-mode="revert" style="display:none;">批次返回</button><button class="btn btn-warning batch-action" data-scope="parentPendingList" data-mode="delete">批次刪除</button></div><div class="record-list" id="parentPendingList"></div>
    </div>
  </div>

  <div class="section-block">
    <h3><i class="fa-solid fa-spinner"></i> 處理中 <span class="total-badge" id="processingCount">0</span></h3>
    <div class="batch-bar" id="processingListBatchBar" style="display:none;"><label><input type="checkbox" class="batch-all" data-scope="processingList"> 全選</label><span class="batch-count">已選 0 項</span><button class="btn btn-secondary batch-action" data-scope="processingList" data-mode="revert" style="display:none;">批次返回</button><button class="btn btn-warning batch-action" data-scope="processingList" data-mode="delete">批次刪除</button></div><div class="record-list" id="processingList" style="max-height:400px;"></div>
  </div>

  <div class="section-block" style="background:#e6f3ff;border-color:#17a2b8;">
    <h3><i class="fa-solid fa-pen-to-square"></i> 手動登記（現場）</h3>
    <div style="display:flex;justify-content:flex-end;margin:-4px 0 8px;"><button type="button" class="btn admin-req-btn" id="adminReqBtn">🔒 管理員解鎖必填設定</button></div>
    <div class="form-row" id="staffFieldWrap">
      <div class="form-group" id="group-name"><label id="label-name">姓名</label><input type="text" id="staffName" placeholder="請輸入姓名"></div>
      <div class="form-group" id="group-email"><label id="label-email">Email</label><input type="email" id="staffEmail" placeholder="example@mail.com"></div>
      <div class="form-group" id="group-phone"><label id="label-phone">電話號碼</label><input type="tel" id="staffPhone" placeholder="例如 9123 4567"></div>
      <div class="form-group" id="group-gender"><label id="label-gender">性別</label><select id="staffGender"><option value="">請選擇</option></select></div>
      <div class="form-group" id="group-service"><label id="label-service">服務項目</label><select id="staffService"><option value="">請選擇</option></select></div>
      <div class="form-group" id="group-voucherCode"><label id="label-voucherCode">優惠券</label><input type="text" id="staffVoucherCode" placeholder="例如 A123（沒有可留空）"></div>
      <div class="form-group" id="group-barber"><label id="label-barber">師傅</label><select id="staffBarber"><option value="">請選擇</option></select></div>
    </div>
    <div class="manual-buttons">
      <button class="btn btn-manual-student" id="submitStudentWalkin">一般剪髮登記</button>
      <button class="btn btn-manual-parent" id="submitParentWalkin">優惠券剪髮登記</button>
    </div>
    <div class="note"><i class="fa-solid fa-info-circle"></i> 欄位、名稱、選項與必填規則自動跟隨主頁面設定；登記前會按主頁面的「允許重複」規則檢查未完成預約。</div>
  </div>

  <div class="section-block">
    <h3><i class="fa-regular fa-circle-check" style="color:#28a745;"></i> 已完成 <span class="total-badge" id="completedCount">0</span></h3>
    <div class="batch-bar" id="completedItemsBatchBar" style="display:none;"><label><input type="checkbox" class="batch-all" data-scope="completedItems"> 全選</label><span class="batch-count">已選 0 項</span><button class="btn btn-secondary batch-action" data-scope="completedItems" data-mode="revert" style="display:inline-block;">批次返回</button><button class="btn btn-warning batch-action" data-scope="completedItems" data-mode="delete">批次刪除</button></div><div class="record-list" id="completedItems" style="max-height:420px;"></div>
  </div>

  <div class="section-block">
    <h3><i class="fa-regular fa-circle-xmark" style="color:#dc3545;"></i> 未到達 <span class="total-badge" id="noshowCount">0</span></h3>
    <div class="batch-bar" id="noshowItemsBatchBar" style="display:none;"><label><input type="checkbox" class="batch-all" data-scope="noshowItems"> 全選</label><span class="batch-count">已選 0 項</span><button class="btn btn-secondary batch-action" data-scope="noshowItems" data-mode="revert" style="display:inline-block;">批次返回</button><button class="btn btn-warning batch-action" data-scope="noshowItems" data-mode="delete">批次刪除</button></div><div class="record-list" id="noshowItems" style="max-height:420px;"></div>
  </div>

  <div class="stats-container">
    <h3 style="margin-top:0;"><i class="fa-solid fa-chart-column"></i> 即時統計</h3>
    <div class="chart-container"><canvas id="barberChart"></canvas></div>
    <div class="stats-summary">
      <div class="summary-card"><div class="number" id="totalCompleted">0</div><div class="label">已完成訂單</div></div>
      <div class="summary-card"><div class="number" id="totalVouchers">0</div><div class="label">已買 $20 優惠券</div></div>
    </div>
  </div>

  <div class="footer">@vison 11.2 | 一般／優惠券雙欄 | 手動登記跟隨主頁面設定 | 管理員可設定必填</div>
</div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyCTgUIWXKjNZqp-bC1jk-XxZvoMihs6vO4",
    authDomain: "hairworld-2026.firebaseapp.com",
    projectId: "hairworld-2026",
    storageBucket: "hairworld-2026.firebasestorage.app",
    messagingSenderId: "531811271889",
    appId: "1:531811271889:web:62bf3e37996b9b154831f0"
  };
  firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore(), auth=firebase.auth();
  auth.signInAnonymously().catch(console.error);

  let bookings=[];
  let barberPicks={};
  let config={
    barbers:['師傅A','師傅B','師傅C','師傅D'],
    genders:['男','女'],
    services:['單剪','剪髮+洗頭'],
    googleSheetUrl:"https://script.google.com/macros/s/AKfycbxH03G2l897KUcgNAxU6zj0Pv19hmHqssG3IiJOd_5YbsEa-44h-M2IwFUel04sEWVN/exec"
  };
  let staffEditMode=false;

  function getTodayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
  function normalizeType(t){ return t==='student'?'normal':(t||'normal'); }

  /* ===== Google Sheets 同步（Apps Script Web App） ===== */
  function gsUrl(){ return (config.googleSheetUrl||'').trim(); }
  const GS_TOKEN='hw9Kq2Zx-7pLmR4vT';
  let STAFF_EDIT_OK=false;
  const ROLE_KEY={staffEdit:'staffEditPassword'};
  function gsJsonpParams(params, cb){
    const u=gsUrl();
    if(!u){ cb({ok:false,error:'未設定 Apps Script 網址'}); return; }
    const name='gsCb'+Math.floor(Math.random()*1e9);
    let finished=false;
    window[name]=function(d){ finished=true; try{delete window[name];}catch(e){} cb(d||{ok:false}); };
    const qs=Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
    const s=document.createElement('script');
    s.src=u+(u.indexOf('?')>=0?'&':'?')+qs+'&token='+encodeURIComponent(GS_TOKEN)+'&callback='+name+'&_='+Date.now();
    s.onerror=function(){ if(!finished) cb({ok:false,error:'無法連線（請確認部署權限為「任何人」）'}); };
    document.body.appendChild(s);
  }
  function waitJson(params){
    return new Promise(function(res){
      let done=false;
      gsJsonpParams(params,function(d){ if(done) return; done=true; res(d||{}); });
      setTimeout(function(){ if(!done){ done=true; res({ok:false,error:'timeout'}); } },9000);
    });
  }
  async function authRole(role, pwd){
    if(STAFF_EDIT_OK) return true;
    if(!gsUrl()){ alert('未設定 Google Sheets 網址，無法驗證密碼'); return false; }
    const d=await waitJson({action:'auth', role:ROLE_KEY[role]||role, p:pwd===null||pwd===undefined?'':String(pwd)});
    if(d && d.ok){ STAFF_EDIT_OK=true; return true; }
    if(d && d.error==='not configured'){ alert('Google Sheets「設定」分頁尚未填寫該密碼'); return false; }
    alert('密碼不正確，或未能連線 Google Sheets');
    return false;
  }
  function gsPost(payload){
    const u=gsUrl(); if(!u) return;
    payload.token=GS_TOKEN;
    try{ fetch(u,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'text/plain;charset=utf-8'}}).catch(function(){}); }catch(e){}
  }
  function gsRecord(o){
    o=o||{};
    function nz(v){ return (v===null)?null:(v===undefined?'':v); }
    return {id:o.id||'',type:normalizeType(o.type),email:nz(o.email),name:nz(o.name),gender:nz(o.gender),service:nz(o.service),
      voucherCode:nz(o.voucherCode),phone:nz(o.phone),
      barber:nz(o.barber),date:nz(o.date),time:nz(o.time),status:nz(o.status||'pending'),
      voucherPurchased:!!o.voucherPurchased,createdAt:nz(o.createdAt),completedAt:nz(o.completedAt),
      noShowAt:nz(o.noShowAt),updatedAt:nz(o.updatedAt),source:nz(o.source)};
  }

  async function fetchAllBookings(){
    try{
      const snap=await db.collection("appointments").get();
      bookings=[];
      snap.forEach(doc=>{
        const d=doc.data(); d.id=doc.id;
        if(d.date&&typeof d.date==='string'&&d.date.includes('T')) d.date=d.date.split('T')[0];
        if(!d.status) d.status='pending';
        d.type=normalizeType(d.type);
        if(!d.voucherPurchased) d.voucherPurchased=false;
        bookings.push(d);
      });
    }catch(e){ console.error('讀取失敗',e); }
  }

  async function fetchConfig(){
    try{
      const doc=await db.collection("config").doc("settings").get();
      if(doc.exists){
        const data=doc.data();
        Object.assign(config,data);
        if(!Array.isArray(config.barbers)||!config.barbers.length) config.barbers=['師傅A','師傅B','師傅C','師傅D'];
        if(!Array.isArray(config.genders)||!config.genders.length) config.genders=['男','女'];
        if(!Array.isArray(config.services)||!config.services.length) config.services=['單剪','剪髮+洗頭'];
        if(!config.googleSheetUrl) config.googleSheetUrl='';
      }
      renderOptionSelects();
    }catch(e){ console.error('讀取設定失敗',e); }
  }

  function renderOptionSelects(){
    document.getElementById('staffGender').innerHTML='<option value="">請選擇</option>'+config.genders.map(v=>`<option value="${v}">${v}</option>`).join('');
    document.getElementById('staffService').innerHTML='<option value="">請選擇</option>'+config.services.map(v=>`<option value="${v}">${v}</option>`).join('');
    document.getElementById('staffBarber').innerHTML='<option value="">請選擇師傅</option>'+config.barbers.map(v=>`<option value="${v}">${v}</option>`).join('');
    applyStaffFieldSettings();
  }

  const STAFF_FIELDS=['email','name','gender','service','voucherCode','phone'];
  const STAFF_FIELD_DEFAULT={email:'Email',name:'姓名',gender:'性別',service:'服務項目',voucherCode:'優惠券',phone:'電話號碼'};
  const ADMIN_EMAIL='hairworld.admin@hairworld.com';
  let staffAdminMode=false;
  function staffFieldCfg(name,def){
    var v=config[name];
    if(!v||typeof v!=='object') return def;
    return Object.assign({},def,v);
  }
  function staffRequired(f){
    var req=staffFieldCfg('requiredFields',{email:true,name:true,gender:true,service:true,voucherCode:false,phone:false});
    return !!req[f];
  }
  function staffVisible(f){ var v=staffFieldCfg('visibleFields',{email:true,name:true,gender:true,service:true,voucherCode:true,phone:true}); return f==='voucherCode'?true:!!v[f]; }
  function staffAllowDup(f){ var v=staffFieldCfg('allowDuplicate',{email:false,name:false,gender:true,service:true,voucherCode:false,phone:false}); return !!v[f]; }
  function staffEffectiveRequired(f){
    var ov=(config.staffManualRequired&&typeof config.staffManualRequired==='object')?config.staffManualRequired:{};
    if(ov[f]!==undefined&&ov[f]!==null) return !!ov[f];
    if(f==='barber') return true;
    return staffRequired(f);
  }
  function applyStaffFieldSettings(){
    var vis=staffFieldCfg('visibleFields',{email:true,name:true,gender:true,service:true,voucherCode:true,phone:true});
    var labels=staffFieldCfg('fieldLabels',STAFF_FIELD_DEFAULT);
    var order=(Array.isArray(config.fieldOrder)?config.fieldOrder:[]).slice();
    STAFF_FIELDS.forEach(function(f){ if(order.indexOf(f)<0) order.push(f); });
    var wrap=document.getElementById('staffFieldWrap');
    if(wrap){
      order.forEach(function(f){ var g=document.getElementById('group-'+f); if(g) wrap.appendChild(g); });
      var gb=document.getElementById('group-barber'); if(gb) wrap.appendChild(gb);
    }
    STAFF_FIELDS.concat(['barber']).forEach(function(f){
      var g=document.getElementById('group-'+f);
      if(g) g.style.display=(f==='voucherCode'||vis[f]||f==='barber')?'block':'none';
      var lab=document.getElementById('label-'+f);
      if(!lab) return;
      var txt=lab.querySelector('.lab-text');
      if(!txt){ lab.textContent=''; txt=document.createElement('span'); txt.className='lab-text'; lab.appendChild(txt); }
      txt.textContent=(f==='barber'?'師傅':(labels[f]||STAFF_FIELD_DEFAULT[f]));
      var required=staffEffectiveRequired(f)&&(f==='barber'||vis[f]);
      lab.classList.toggle('required',required);
      var tog=lab.querySelector('.req-toggle');
      if(!tog){
        tog=document.createElement('span'); tog.className='req-toggle';
        tog.innerHTML='<input type="checkbox" class="req-chk" data-req="'+f+'"><span>必填</span>';
        lab.appendChild(tog);
      }
      var chk=tog.querySelector('input');
      chk.checked=required;
      chk.disabled=!staffAdminMode;
      tog.classList.toggle('on',required);
    });
  }
  function applyAdminReqButton(){
    var btn=document.getElementById('adminReqBtn');
    if(!btn) return;
    btn.textContent=staffAdminMode?'🔓 管理員模式（點此鎖定）':'🔒 管理員解鎖必填設定';
    btn.classList.toggle('on',staffAdminMode);
  }
  async function saveStaffRequired(){
    try{
      await db.collection('config').doc('settings').set({staffManualRequired:Object.assign({},config.staffManualRequired||{})},{merge:true});
      return true;
    }catch(e){
      console.error('儲存必填設定失敗',e);
      alert('儲存必填設定失敗：'+(e.code||e.message)+'\n請確認管理員帳號已登入。');
      return false;
    }
  }
  function barberRadios(b,prefix){
    return config.barbers.map(x=>`<button type="button" class="barber-chip" data-booking="${b.id}" data-value="${x}">${x}</button>`).join('');
  }

  function infoHtml(b,icon){
    return `<div class="record-info"><span class="time">${b.time||''}</span> ${icon} ${b.name||''} ${b.gender||''}／${b.service||''}
      <br><span class="sub">${b.email||'（無 Email）'}</span></div>`;
  }

  async function renderStaffPage(dateStr){
    if(!dateStr) dateStr=getTodayStr();
    document.getElementById('staffDatePicker').value=dateStr;
    await fetchAllBookings();

    const pendN=bookings.filter(b=>b.date===dateStr&&b.status==='pending'&&b.type==='normal');
    const pendV=bookings.filter(b=>b.date===dateStr&&b.status==='pending'&&b.type==='voucher');
    const proc=bookings.filter(b=>b.date===dateStr&&b.status==='processing');
    const comp=bookings.filter(b=>b.status==='completed'&&b.date===dateStr).sort((a,b)=>(b.updatedAt||b.completedAt||'').localeCompare(a.updatedAt||a.completedAt||''));
    const no=bookings.filter(b=>b.status==='no-show'&&b.date===dateStr).sort((a,b)=>(b.updatedAt||b.noShowAt||'').localeCompare(a.updatedAt||a.noShowAt||''));

    document.getElementById('studentPendingCount').innerText=pendN.length;
    document.getElementById('parentPendingCount').innerText=pendV.length;
    document.getElementById('processingCount').innerText=proc.length;
    document.getElementById('completedCount').innerText=comp.length;
    document.getElementById('noshowCount').innerText=no.length;

    const boxN=document.getElementById('studentPendingList');
    boxN.innerHTML=pendN.length?'':'<div style="padding:30px;text-align:center;">無一般預約</div>';
    pendN.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(b=>{
      const div=document.createElement('div'); div.className='record-item';
      div.innerHTML=`<input type="checkbox" class="batch-chk" data-scope="studentPendingList" data-id="${b.id}">`+infoHtml(b,'')
        +`<div class="barber-selector">${barberRadios(b,'n')}</div>
          <div class="record-actions">
            <button class="btn btn-success mark-processing" data-id="${b.id}" data-type="normal">開始剪髮</button>
            <button class="btn btn-warning mark-noshow" data-id="${b.id}">未到達</button>
          </div>`;
      boxN.appendChild(div);
    });

    const boxV=document.getElementById('parentPendingList');
    boxV.innerHTML=pendV.length?'':'<div style="padding:30px;text-align:center;">無優惠券預約</div>';
    pendV.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(b=>{
      const div=document.createElement('div'); div.className='record-item voucher';
      div.innerHTML=`<input type="checkbox" class="batch-chk" data-scope="parentPendingList" data-id="${b.id}">`+infoHtml(b,'［$20券］')
        +`<div class="barber-selector">${barberRadios(b,'v')}</div>
          <div class="record-actions">
            <button class="btn btn-success mark-parent-complete" data-id="${b.id}">已完成</button>
            <button class="btn btn-warning mark-noshow" data-id="${b.id}">未到達</button>
          </div>`;
      boxV.appendChild(div);
    });

    const boxP=document.getElementById('processingList');
    boxP.innerHTML=proc.length?'':'<div style="padding:30px;text-align:center;">無處理中預約</div>';
    proc.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(b=>{
      const div=document.createElement('div'); div.className='record-item'+(b.type==='voucher'?' voucher':'');
      div.innerHTML=`<input type="checkbox" class="batch-chk" data-scope="processingList" data-id="${b.id}">`+infoHtml(b,`｜師傅：${b.barber||'未指派'}`)
        +`<div class="record-actions">
            <button class="btn btn-success mark-complete-with-voucher" data-id="${b.id}">買 $20 券</button>
            <button class="btn btn-secondary mark-complete-without-voucher" data-id="${b.id}">未買券</button>
          </div>`;
      boxP.appendChild(div);
    });

    renderList('completedItems',comp,'completed');
    renderList('noshowItems',no,'noshow');
    loadStats();
    batchSyncAll();
  }

  function batchCheckboxes(scope){ return Array.from(document.querySelectorAll('.batch-chk[data-scope="'+scope+'"]')); }
  function batchSyncBar(scope){
    const bar=document.getElementById(scope+'BatchBar');
    if(!bar) return;
    const boxes=batchCheckboxes(scope), sel=boxes.filter(c=>c.checked);
    bar.style.display=boxes.length?'flex':'none';
    const cnt=bar.querySelector('.batch-count');
    if(cnt) cnt.innerText='已選 '+sel.length+' 項';
    const all=bar.querySelector('.batch-all');
    if(all) all.checked=boxes.length>0&&sel.length===boxes.length;
    boxes.forEach(c=>{ const row=c.closest('.record-item')||c.closest('tr'); if(row) row.classList.toggle('is-checked',c.checked); });
  }
  function batchSyncAll(){
    ['studentPendingList','parentPendingList','processingList','completedItems','noshowItems'].forEach(batchSyncBar);
  }
  async function batchDo(scope,mode){
    const ids=batchCheckboxes(scope).filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length){ alert('請先勾選資料'); return; }
    if(mode==='delete'){
      if(!staffEditMode){ alert('請先解鎖編輯模式'); return; }
      if(!confirm('確定刪除已選的 '+ids.length+' 筆記錄？此操作無法復原')) return;
      for(const id of ids){ await deleteById(id); }
    }else{
      if(!staffEditMode){ alert('請先解鎖編輯模式'); return; }
      if(!confirm('確定把已選的 '+ids.length+' 筆改回「待處理」？')) return;
      for(const id of ids){ await updateStatus(id,'pending',{completedAt:null}); }
    }
    await fetchAllBookings();
    renderStaffPage(document.getElementById('staffDatePicker').value);
  }

  function renderList(boxId,items,kind){
    const box=document.getElementById(boxId);
    if(!items.length){ box.innerHTML='<div style="padding:20px;text-align:center;">無記錄</div>'; return; }
    box.innerHTML=items.map(b=>{
      const ut=b.updatedAt||(kind==='completed'?b.completedAt:b.noShowAt);
      const t=ut?new Date(ut).toLocaleTimeString('zh-HK',{hour12:false,hour:'2-digit',minute:'2-digit'}):'';
      const tag=b.type==='voucher'?'［券］':'';
      let acts='';
      if(kind==='completed'&&(staffEditMode)) acts+=`<button class="btn btn-secondary revert-complete" data-id="${b.id}" style="padding:8px 14px;min-width:auto;">返回</button>`;
      if(staffEditMode) acts+=`<button class="btn btn-warning delete-record" data-id="${b.id}" style="padding:8px 14px;min-width:auto;">刪除</button>`;
      const bScope=kind==='completed'?'completedItems':'noshowItems';
      return `<div class="record-item${b.type==='voucher'?' voucher':''}">
        <input type="checkbox" class="batch-chk" data-scope="${bScope}" data-id="${b.id}">
        <div class="record-info"><span class="sub">[${t}]</span> <span class="time">${b.time||''}</span> ${tag} ${b.name||''} ${b.gender||''}／${b.service||''}
        <br><span class="sub">師傅：${b.barber||'-'}｜${b.email||'（無 Email）'}｜$20券：${b.voucherPurchased?'有':'無'}</span></div>
        <div class="record-actions">${acts}</div></div>`;
    }).join('');
  }

  let chart=null;
  function loadStats(){
    const comp=bookings.filter(b=>b.status==='completed');
    document.getElementById('totalCompleted').innerText=comp.length;
    document.getElementById('totalVouchers').innerText=comp.filter(b=>b.voucherPurchased===true).length;

    const st={}; config.barbers.forEach(n=>st[n]={s:0,v:0});
    comp.forEach(b=>{ if(b.barber&&st[b.barber]){ st[b.barber].s++; if(b.voucherPurchased) st[b.barber].v++; } });

    const ctx=document.getElementById('barberChart').getContext('2d');
    if(chart) chart.destroy();
    chart=new Chart(ctx,{
      type:'bar',
      data:{labels:config.barbers,datasets:[
        {label:'服務量（已剪）',data:config.barbers.map(n=>st[n].s),backgroundColor:'#F25C0A',borderRadius:10},
        {label:'$20 券售出',data:config.barbers.map(n=>st[n].v),backgroundColor:'#28a745',borderRadius:10}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}
    });
  }

  async function updateStatus(id,status,extra){
    try{ await db.collection("appointments").doc(id).update({status:status,updatedAt:new Date().toISOString(),...extra});
      const gsBase=bookings.find(x=>x.id===id)||{};
      gsPost({action:'upsert',record:gsRecord(Object.assign({},gsBase,extra,{id:id,status:status,updatedAt:new Date().toISOString()}))});
      return true; }
    catch(e){ console.error(e); return false; }
  }
  async function deleteById(id){
    try{ await db.collection("appointments").doc(id).delete();
      gsPost({action:'delete',id:id});
      return true; }
    catch(e){ console.error(e); return false; }
  }

  document.addEventListener('change',function(e){
    const t=e.target;
    if(t.classList&&t.classList.contains('batch-chk')){ batchSyncBar(t.dataset.scope); return; }
    if(t.classList&&t.classList.contains('batch-all')){
      const scope=t.dataset.scope;
      batchCheckboxes(scope).forEach(c=>c.checked=t.checked);
      batchSyncBar(scope);
    }
  });

  document.addEventListener('click',async function(e){
    const t=e.target;
    const date=document.getElementById('staffDatePicker').value;
    if(t.classList.contains('batch-action')){ await batchDo(t.dataset.scope,t.dataset.mode); return; }

    if(t.classList.contains('barber-chip')){
      const bid=t.dataset.booking, val=t.dataset.value;
      barberPicks[bid]=val;
      const box=t.closest('.barber-selector');
      if(box){ box.querySelectorAll('.barber-chip').forEach(function(x){ x.classList.toggle('active', x===t); }); }
      return;
    }
    if(t.classList.contains('mark-processing')){
      const pick=barberPicks[t.dataset.id];
      if(!pick){ alert('請先點選師傅名字'); return; }
      delete barberPicks[t.dataset.id];
      await updateStatus(t.dataset.id,'processing',{barber:pick});
      renderStaffPage(date); return;
    }
    if(t.classList.contains('mark-parent-complete')){
      const pick=barberPicks[t.dataset.id];
      if(!pick){ alert('請先點選師傅名字'); return; }
      delete barberPicks[t.dataset.id];
      await updateStatus(t.dataset.id,'completed',{completedAt:new Date().toISOString(),barber:pick,voucherPurchased:false});
      renderStaffPage(date); return;
    }
    if(t.classList.contains('mark-noshow')){
      await updateStatus(t.dataset.id,'no-show',{noShowAt:new Date().toISOString()});
      renderStaffPage(date); return;
    }
    if(t.classList.contains('mark-complete-with-voucher')){
      await updateStatus(t.dataset.id,'completed',{completedAt:new Date().toISOString(),voucherPurchased:true});
      renderStaffPage(date); return;
    }
    if(t.classList.contains('mark-complete-without-voucher')){
      await updateStatus(t.dataset.id,'completed',{completedAt:new Date().toISOString(),voucherPurchased:false});
      renderStaffPage(date); return;
    }
    if(t.classList.contains('revert-complete')){
      if(!staffEditMode){ alert('請先解鎖編輯模式'); return; }
      if(!confirm('返回為待處理？')) return;
      await updateStatus(t.dataset.id,'pending',{completedAt:null});
      renderStaffPage(date); return;
    }
    if(t.classList.contains('delete-record')){
      if(!staffEditMode){ alert('請先解鎖編輯模式'); return; }
      if(!confirm('確定刪除此記錄？此操作無法復原')) return;
      await deleteById(t.dataset.id);
      renderStaffPage(date); return;
    }
  });

  function staffWithTimeout(p,ms,val){
    return Promise.race([p,new Promise(function(res){ setTimeout(function(){ res(val); },ms); })]);
  }
  async function manualRegister(type){
    var name=document.getElementById('staffName').value.trim();
    var email=document.getElementById('staffEmail').value.trim();
    var phone=document.getElementById('staffPhone').value.trim();
    var gender=document.getElementById('staffGender').value;
    var service=document.getElementById('staffService').value;
    var barber=document.getElementById('staffBarber').value;
    var voucherCode=document.getElementById('staffVoucherCode').value.trim().toUpperCase();

    var missing=[];
    if(staffVisible('name')&&staffEffectiveRequired('name')&&!name) missing.push('姓名');
    if(staffVisible('email')&&staffEffectiveRequired('email')&&!email) missing.push('Email');
    if(staffVisible('phone')&&staffEffectiveRequired('phone')&&!phone) missing.push('電話號碼');
    if(staffVisible('gender')&&staffEffectiveRequired('gender')&&!gender) missing.push('性別');
    if(staffVisible('service')&&staffEffectiveRequired('service')&&!service) missing.push('服務項目');
    if(staffVisible('voucherCode')&&staffEffectiveRequired('voucherCode')&&!voucherCode) missing.push('優惠券號碼');
    if(staffEffectiveRequired('barber')&&!barber) missing.push('師傅');
    if(missing.length){ alert('請填寫：'+missing.join('、')); return; }
    if(email&&!email.includes('@')){ alert('Email 格式不正確'); return; }

    // 按主頁面同一套「允許重複」規則，只檢查未完成（pending／processing）預約
    var active=[];
    if(staffVisible('email')&&!staffAllowDup('email')&&email) active.push({k:'email',v:email,label:'Email'});
    if(staffVisible('name')&&!staffAllowDup('name')&&name) active.push({k:'name',v:name,label:'姓名'});
    if(staffVisible('phone')&&!staffAllowDup('phone')&&phone) active.push({k:'phone',v:phone,label:'電話號碼'});
    if(staffVisible('voucherCode')&&!staffAllowDup('voucherCode')&&voucherCode) active.push({k:'voucherCode',v:voucherCode,label:'優惠券號碼'});
    var jobs=active.map(function(p){
      return db.collection('appointments').where(p.k,'==',p.v).limit(20).get().then(function(snap){
        var hit=null;
        snap.forEach(function(doc){
          var d=doc.data();
          if(['pending','processing'].includes(d.status||'pending') && normalizeType(d.type)===type && String(d[p.k]||'').trim().toLowerCase()===p.v.toLowerCase()) hit=d;
        });
        return hit?{p:p,d:hit}:null;
      }).catch(function(e){ console.error('重複檢查失敗',p.k,e); return null; });
    });
    var res=await staffWithTimeout(Promise.all(jobs),8000,null);
    if(!res){ alert('網絡較慢，未能完成即時重複檢查；如重複登記，請自行核對記錄。'); }
    else{
      for(var i=0;i<res.length;i++){
        var r=res[i];
        if(r){
          alert('已有相同'+r.p.label+'（'+r.p.v+'）的未完成預約，不能重複登記。\n\n姓名：'+(r.d.name||'')+'\n狀態：'+(r.d.status||'')+'\n日期：'+(r.d.date||'')+' '+(r.d.time||''));
          return;
        }
      }
    }

    // 優惠券號碼沿用主頁面的格式／可用範圍檢查
    if(voucherCode){
      var rules=(Array.isArray(config.voucherCodeRules)?config.voucherCodeRules:[]).filter(function(r){ return r&&r.prefix; });
      if(rules.length){
        var rule=rules.find(function(r){ return voucherCode.indexOf(String(r.prefix))===0; });
        if(!rule){ alert('優惠券號碼格式不正確，請確認前綴（可用：'+rules.map(function(r){return r.prefix;}).join('、')+'）'); return; }
        var num=parseInt(String(voucherCode).slice(String(rule.prefix).length),10);
        if(!isFinite(num)||num<Number(rule.from)||num>Number(rule.to)){
          alert('此號碼不在可用範圍（'+rule.prefix+rule.from+' 至 '+rule.prefix+rule.to+'）'); return;
        }
      }
    }

    // 優惠券號碼沿用主頁面的「不可重複使用」檢查
    if(voucherCode){
      try{
        var vsnap=await staffWithTimeout(db.collection('appointments').where('voucherCode','==',voucherCode).limit(20).get(),8000,null);
        if(vsnap){
          var used=false;
          vsnap.forEach(function(doc){ if((doc.data().status||'')!=='cancelled') used=true; });
          if(used){ alert('此優惠券號碼（'+voucherCode+'）已使用過，不能重複使用'); return; }
        }
      }catch(e){ console.error('券號檢查失敗',e); }
    }

    var now=new Date();
    var nowTime=now.toTimeString().slice(0,5);
    try{
      var gsRef=await db.collection('appointments').add({
        email:email, name:name, gender:gender, service:service, phone:phone, voucherCode:voucherCode,
        date:getTodayStr(), time:nowTime, barber:barber,
        status:'completed', type:type, voucherPurchased:false,
        voucherKind:(type==='voucher'?'v20':''),
        completedAt:now.toISOString(), updatedAt:now.toISOString(), source:'walkin'
      });
      gsPost({action:'upsert',record:gsRecord({id:gsRef.id,type:type,email:email,name:name,gender:gender,service:service,phone:phone,voucherCode:voucherCode,barber:barber,date:getTodayStr(),time:nowTime,status:'completed',voucherPurchased:false,completedAt:now.toISOString(),updatedAt:now.toISOString(),source:'walkin'})});
      ['staffName','staffEmail','staffPhone','staffVoucherCode'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('staffGender').value='';
      document.getElementById('staffService').value='';
      await renderStaffPage(getTodayStr());
      alert(`登記成功\n${type==='voucher'?'（優惠券）':''}\n${name} ${gender}／${service}\n師傅：${barber}`);
    }catch(err){ alert('登記失敗：'+err.message); }
  }
  document.getElementById('submitStudentWalkin').addEventListener('click',()=>manualRegister('normal'));
  document.getElementById('submitParentWalkin').addEventListener('click',()=>manualRegister('voucher'));

  document.getElementById('adminReqBtn').addEventListener('click',async function(){
    if(staffAdminMode){
      staffAdminMode=false;
      applyStaffFieldSettings(); applyAdminReqButton();
      try{ await auth.signOut(); await auth.signInAnonymously(); }catch(e){}
      alert('已鎖定必填設定；職員無法再更改。');
      return;
    }
    var pwd=prompt('請輸入管理員密碼（不是員工編輯密碼）');
    if(pwd===null) return;
    try{
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL,pwd);
      staffAdminMode=true;
      applyStaffFieldSettings(); applyAdminReqButton();
      alert('已進入管理員模式，現在可勾選／取消各欄位的「必填」。');
    }catch(e){
      alert('管理員登入失敗：'+(e.code||e.message)+'\n請使用固定管理員帳號的密碼。');
    }
  });

  document.addEventListener('change',async function(e){
    var t=e.target;
    if(!t.classList||!t.classList.contains('req-chk')) return;
    var f=t.dataset.req;
    if(!staffAdminMode){ t.checked=staffEffectiveRequired(f); applyStaffFieldSettings(); alert('必填設定只有管理員可更改。'); return; }
    var old=(config.staffManualRequired&&config.staffManualRequired[f]!==undefined)?config.staffManualRequired[f]:undefined;
    if(!config.staffManualRequired||typeof config.staffManualRequired!=='object') config.staffManualRequired={};
    config.staffManualRequired[f]=t.checked;
    applyStaffFieldSettings();
    var ok=await saveStaffRequired();
    if(!ok){
      if(old===undefined) delete config.staffManualRequired[f]; else config.staffManualRequired[f]=old;
      applyStaffFieldSettings();
    }
  });

  document.getElementById('staffRefreshBtn').addEventListener('click',()=>renderStaffPage(document.getElementById('staffDatePicker').value));
  document.getElementById('staffDatePicker').addEventListener('change',function(){ renderStaffPage(this.value); });

  document.getElementById('unlockEditBtn').addEventListener('click',async function(){
    const pwd=prompt('請輸入編輯解鎖密碼');
    if(pwd===null) return;
    if(await authRole('staffEdit', pwd)){
      staffEditMode=true;
      document.getElementById('editModeBadge').style.display='inline-block';
      renderStaffPage(document.getElementById('staffDatePicker').value);
      alert('編輯模式已啟用');
    }else alert('密碼錯誤');
  });

  /* ===== 夜間模式（只記在本機，不影響任何預約資料） ===== */
  const THEME_KEY='hwThemeMode';
  function applyTheme(mode){
    const dark=(mode==='dark');
    document.body.classList.toggle('dark',dark);
    const btn=document.getElementById('themeToggle');
    if(btn) btn.textContent=dark?'日間模式':'夜間模式';
    if(window.Chart){ try{ Chart.defaults.color=dark?'#B9C2CC':'#5B4A3A'; }catch(e){} }
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'light');
  (function(){
    const btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click',function(){
      const next=(localStorage.getItem(THEME_KEY)==='dark')?'light':'dark';
      localStorage.setItem(THEME_KEY,next);
      applyTheme(next);
    });
  })();

  /* ===== 頁面底色：一／二／沒有（存雲端，所有裝置共用） ===== */
  const BG_KEY='hwPageBg';
  function applyPageBg(v, alpha){
    const val=(String(v)==='1'||String(v)==='2')?String(v):'0';
    const a=(alpha===undefined||alpha===null||alpha==='')?90:Number(alpha);
    if(val==='1'||val==='2'){ document.body.setAttribute('data-hwbg',val); } else { document.body.removeAttribute('data-hwbg'); }
    document.body.style.setProperty('--hw-surf', String(a/100));
    document.querySelectorAll('.bg-choice').forEach(function(b){ b.classList.toggle('active', b.dataset.bg===val); });
  }
  applyPageBg(localStorage.getItem(BG_KEY)||'0');
/* 底色改由管理員頁面控制（後台「底色與介面顏色 ② 員工頁面」） */

  (async function init(){
    await auth.signInAnonymously();
    await fetchConfig();
    applyPageBg((config.pageBg!==undefined&&config.pageBg!==null&&config.pageBg!=='')?config.pageBg:(localStorage.getItem(BG_KEY)||'0'), config.pageBgAlpha);
    try{
      db.collection("config").doc("settings").onSnapshot(function(doc){
        if(!doc.exists) return;
        const c=doc.data()||{};
        applyPageBg((c.pageBg===undefined||c.pageBg===null||c.pageBg==='')?'0':c.pageBg, c.pageBgAlpha);
      });
    }catch(e){}
    await renderStaffPage(getTodayStr());
  })();
})();
</script>
